[package]
name = "accord-sapient-client"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
accord-private-client = { path = "../accord-private-client" }
tari_template_lib = { version = "=0.37.0", features = ["serde"] }
tari_template_lib_types = { version = "=0.36.0", features = ["serde"] }
tari_ootle_wallet_crypto = "=0.50.0"
tari_ootle_transaction = { version = "=0.49.0", features = ["serde"] }
tari_ootle_common_types = "=0.49.0"
tari_engine_types = "=0.49.0"
base64 = "0.22"
tari_bor = "=0.16.6"
tari_crypto = "=0.24.1"
ootle_byte_type = { version = "=0.18.0", features = ["crypto"] }
ootle-network = "=0.2.0"
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
