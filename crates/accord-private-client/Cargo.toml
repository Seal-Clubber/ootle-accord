[package]
name = "accord-private-client"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tari_template_lib = { version = "=0.40.0", features = ["serde"] }
tari_template_lib_types = { version = "=0.39.0", features = ["serde"] }
tari_ootle_wallet_crypto = "=0.54.0"
tari_ootle_transaction = { version = "=0.53.1", features = ["serde"] }
tari_ootle_common_types = "=0.53.1"
tari_engine_types = "=0.53.1"
tari_crypto = "=0.24.1"
ootle_byte_type = { version = "=0.21.0", features = ["crypto"] }
ootle-network = { version = "=0.2.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
bech32 = "0.11"

[dev-dependencies]
tari_template_test_tooling = "=0.53.1"
